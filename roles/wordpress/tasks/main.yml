---
  - name: Create a directory if it does not exist
    ansible.builtin.file:
      path: /srv/www
      state: directory
      owner: www-data
      group: www-data
    become: yes
  - name: Unarchive a file that needs to be downloaded (added in 2.0)
    ansible.builtin.unarchive:
      src: https://wordpress.org/latest.tar.gz
      dest: /srv/www
      remote_src: yes
    become: yes
  - name: Copy file with owner and permissions
    ansible.builtin.template:
      src: /home/vboxuser/ansible/templates/wordpress.conf.j2
      dest: /etc/apache2/sites-available/000-default.conf
      force: yes
    become: yes
    notify: 
      - restart apache    
  - name: Copy file with owner and permissions
    ansible.builtin.copy:
      src: '{{wp_dir}}/wp-config-sample.php'
      dest: '{{wp_dir}}/wp-config.php'
      remote_src: yes
    become: yes
  - name: Configure wp-config with database
    ansible.builtin.replace:
      path: '{{wp_dir}}/wp-config.php'
      regexp: '{{ item.regexp }}'
      replace: '{{ item.replace }}'
    with_items:
    - { regexp: 'database_name_here', replace: '{{wp_db_name}}'}
    - { regexp: 'username_here', replace: '{{wp_db_user}}'}
    - { regexp: 'password_here', replace: '{{wp_db_pass}}'}
    - { regexp: 'localhost', replace: '{{db_ip}}'}
    become: yes
  - name: Replace a localhost entry searching for a literal string to avoid escaping
    ansible.builtin.lineinfile:
      path: '{{wp_dir}}/wp-config.php'
      search_string: '{{ item.search_string }}'
      line: '{{ item.line }}'
    with_items:
    - { search_string: "define( 'AUTH_KEY',         'put your unique phrase here' );", line: "define('AUTH_KEY',         'tM_Gk$` 0$9;}|Ddyp`}[^6TYxNYDG3=c~ei,SNooq! VLBX12y-s]Z.Y+=D#|;W');" }
    - { search_string: "define( 'SECURE_AUTH_KEY',  'put your unique phrase here' );", line: "define('SECURE_AUTH_KEY',  '^!BX^Yw]$#)O$uAg8-:.h&G#[}5(je=$k>-a>zLQO8i6$~Fz+g3z8;!X8<KF4(-J');" }
    - { search_string: "define( 'LOGGED_IN_KEY',    'put your unique phrase here' );", line: "define('LOGGED_IN_KEY',    '+[$%d`Yd_h_?9-U&/V,Ghx8fKEC<(Vap[9(Ac){IHZY:7P.acadz)vmY-e=kh .+');" }
    - { search_string: "define( 'NONCE_KEY',        'put your unique phrase here' );", line: "define('NONCE_KEY',        'PrlxR**NLvX6+M:CQ967=7~Ar-bHj~mm=wy$FS-:4<+[HL!kq_U1h)ll-@#eNA+Q');" }
    - { search_string: "define( 'AUTH_SALT',        'put your unique phrase here' );", line: "define('AUTH_SALT',        '{js(|SWa40TG(ygOiCoA*06t.vwyaCUERq*1U.>ZVOf_,Kg.*d.iwJ|iZoL|)-NK');" }
    - { search_string: "define( 'SECURE_AUTH_SALT', 'put your unique phrase here' );", line: "define('SECURE_AUTH_SALT', 'gkfq)F!ThDgF@cx|8}F|JV+bkQkUE;#1V*w6|%ISy0-k=?-=lIsU[+B26:FGM+|c');" }
    - { search_string: "define( 'LOGGED_IN_SALT',   'put your unique phrase here' );", line: "define('LOGGED_IN_SALT',   'Q$Xqvp]gdlnxib/69,T7<m%Zh>?35J]9U-0t@65fi:U(G-Aq?BgC$kB5=P@[~ sa');" }
    - { search_string: "define( 'NONCE_SALT',       'put your unique phrase here' );", line: "define('NONCE_SALT',       'kcM,$vX-/*@>g;(gLnym,US({!L-?s-V|a_>M<r@pF]zuq4{@=^ Ii*MT,1s48O(');" }
    become: yes